<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coder Agent - Website Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🤖 AI CODER AGENT</h1>
            <p>Automatically Generate Websites with AI</p>
        </header>

        <div class="app-content">
            <div class="form-section">
                <h2>Create Your Website</h2>
                <form id="websiteForm">
                    <div class="form-group">
                        <label>Website Name:</label>
                        <input type="text" id="name" placeholder="My Awesome Site" required>
                    </div>

                    <div class="form-group">
                        <label>Website Type:</label>
                        <select id="type" required>
                            <option value="portfolio">Portfolio</option>
                            <option value="business">Business</option>
                            <option value="blog">Blog</option>
                            <option value="ecommerce">E-Commerce</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Description:</label>
                        <textarea id="description" placeholder="What is your website about?" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Theme:</label>
                        <select id="theme" required>
                            <option value="modern">Modern</option>
                            <option value="dark">Dark</option>
                            <option value="ocean">Ocean</option>
                            <option value="sunset">Sunset</option>
                            <option value="forest">Forest</option>
                            <option value="minimal">Minimal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select Pages:</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="pages" value="home" checked> Home</label>
                            <label><input type="checkbox" name="pages" value="about"> About</label>
                            <label><input type="checkbox" name="pages" value="contact"> Contact</label>
                            <label><input type="checkbox" name="pages" value="portfolio"> Portfolio</label>
                            <label><input type="checkbox" name="pages" value="services"> Services</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Features:</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="features" value="responsive-design"> Responsive Design</label>
                            <label><input type="checkbox" name="features" value="dark-mode"> Dark Mode</label>
                            <label><input type="checkbox" name="features" value="animations"> Animations</label>
                            <label><input type="checkbox" name="features" value="contact-form"> Contact Form</label>
                            <label><input type="checkbox" name="features" value="newsletter"> Newsletter</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-generate">🚀 Generate Website</button>
                </form>
            </div>

            <div class="results-section">
                <div id="loading" class="loading" style="display:none;">
                    <div class="spinner"></div>
                    <p>🤖 AI Coder is generating your website...</p>
                </div>

                <div id="result" class="result" style="display:none;">
                    <h2>✅ Website Generated Successfully!</h2>
                    <div id="resultContent"></div>
                    <button class="btn-download">📥 Download Code</button>
                    <button class="btn-preview">👀 Preview Website</button>
                </div>

                <div id="websites" class="websites-list">
                    <h3>Generated Websites</h3>
                    <div id="websitesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
